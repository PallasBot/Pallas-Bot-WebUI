name: Release

on:
  pull_request:
    types: [closed]
    branches: [main, master]
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver 递增（更新 package.json / package-lock 并打 v* tag）"
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      prerelease:
        description: "GitHub Release 标记为预发布"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # 正式版：合并进 main/master 的同仓库 PR，或直推 main/master（均默认 patch + v* tag）
    # 直推时排除：机器人发版提交 chore(release):、GitHub PR 合并/squash 类提交（避免与 pull_request 重复发版）
    # 手动：workflow_dispatch；或推送不含 -dev. 的 v* tag
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && (github.event.pull_request.base.ref == 'main' || github.event.pull_request.base.ref == 'master') && github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-dev.')) ||
      (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master') && github.event.head_commit != null && !startsWith(github.event.head_commit.message, 'chore(release):') && !startsWith(github.event.head_commit.message, 'Merge pull request') && !startsWith(github.event.head_commit.message, 'Merge branch') && !contains(github.event.head_commit.message, '(#'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: >-
            ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Bump version and push tag（合并 PR / 直推 main / Actions 手动发版）
        if: >-
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'pull_request' ||
          (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master'))
        env:
          BUMP: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bump || 'patch' }}
          INCLUDE_REFACTOR: "1"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          PREVIOUS=$(git tag -l 'v*' --sort=-version:refname | head -n1 || true)
          npm version "${BUMP}" --no-git-tag-version
          VERSION="v$(node -p "require('./package.json').version")"
          i=0
          while git rev-parse "refs/tags/${VERSION}" >/dev/null 2>&1; do
            i=$((i + 1))
            if [ "$i" -gt 256 ]; then
              echo "::error::连续 patch 后仍无法得到未占用 tag（上限 256）。请删除冲突远端 tag，或先把 package.json 的 version 对齐当前发版线后再发版。最后尝试: ${VERSION}"
              exit 1
            fi
            echo "::notice::Tag ${VERSION} 在已 fetch 的 refs/tags 中已存在，自动再执行一次 patch 以对齐全局发版线"
            npm version patch --no-git-tag-version
            VERSION="v$(node -p "require('./package.json').version")"
          done
          chmod +x tools/generate_release_changelog.sh tools/prepend_changelog_section.sh
          SECTION_FILE="$(mktemp)"
          ./tools/generate_release_changelog.sh "${PREVIOUS}" "HEAD" "${{ github.repository }}" >"${SECTION_FILE}"
          ./tools/prepend_changelog_section.sh "${VERSION}" "${SECTION_FILE}"
          rm -f "${SECTION_FILE}"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): ${VERSION}"
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git push origin "HEAD:${{ github.event.pull_request.base.ref }}"
          else
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          git push origin "${VERSION}"

      - name: Resolve release tag
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "pull_request" ] || [[ "$REF" == refs/heads/main || "$REF" == refs/heads/master ]]; then
            T="v$(node -p "require('./package.json').version")"
          elif [[ "$REF" == refs/tags/* ]]; then
            T="${REF#refs/tags/}"
          else
            echo "::error::无法解析发版 tag（event=${EVENT_NAME} ref=${REF}）"
            exit 1
          fi
          echo "tag=${T}" >> "$GITHUB_OUTPUT"

      - name: Resolve HEAD SHA
        id: gitmeta
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          CONSOLE_VERSION: ${{ steps.ver.outputs.tag }}
          GIT_COMMIT: ${{ steps.gitmeta.outputs.sha }}
        run: |
          export BUILD_TIME="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          npm run build:ci

      - name: Sync console-version.json to release tag
        env:
          CONSOLE_VERSION: ${{ steps.ver.outputs.tag }}
          GIT_COMMIT: ${{ steps.gitmeta.outputs.sha }}
        run: |
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          export CONSOLE_VERSION GIT_COMMIT BUILD_TIME
          node ./scripts/write-console-version.mjs

      - name: Pack dist.zip
        run: |
          cd dist
          zip -r ../dist.zip .

      - name: Generate changelog
        id: changelog
        env:
          VERSION: ${{ steps.ver.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
          INCLUDE_REFACTOR: "1"
        run: |
          set -euo pipefail
          chmod +x tools/generate_release_changelog.sh
          PREVIOUS=""
          if git rev-parse "${VERSION}^{commit}" >/dev/null 2>&1; then
            PREVIOUS=$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || true)
          fi
          if [ -z "${PREVIOUS}" ]; then
            PREVIOUS=$(git tag -l 'v*' --sort=-version:refname | grep -Fxv "${VERSION}" | head -n1 || true)
          fi
          CHANGELOG=$(./tools/generate_release_changelog.sh "${PREVIOUS}" "${VERSION}" "${REPOSITORY}")
          {
            echo 'changelog<<EOF'
            echo "${CHANGELOG}"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Release ${{ steps.ver.outputs.tag }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prerelease }}
          files: dist.zip
          body: |
            ## 更新内容

            ${{ steps.changelog.outputs.changelog }}

            附件 **`dist.zip`**：由 Pallas-Bot `pallas_webui` 自动拉取，或手动解压到 `data/pallas_webui/public/`。

            完整历史见 [`CHANGELOG.md`](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)。
