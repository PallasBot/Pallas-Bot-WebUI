name: Release

on:
  pull_request:
    types: [closed]
    branches: [main, master]
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver 递增（更新 package.json / package-lock 并打 v* tag）"
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      prerelease:
        description: "GitHub Release 标记为预发布"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # 正式版：合并进 main/master 的同仓库 PR（workflow 在 closed 时触发，merged 由 if 约束）
    # 测试版：直推 main/master，且排除合并类提交 / 机器人发版提交 / GitHub squash 常见标题里的 (#nn)
    # 手动：workflow_dispatch；或推送不含 -dev. 的 v* tag
    # 跳过：由本工作流创建的 v*-dev.* tag 触发的二次 push（若 token 会级联触发）
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && (github.event.pull_request.base.ref == 'main' || github.event.pull_request.base.ref == 'master') && github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-dev.')) ||
      (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master') && github.event.head_commit != null && !startsWith(github.event.head_commit.message, 'chore(release):') && !startsWith(github.event.head_commit.message, 'Merge pull request') && !startsWith(github.event.head_commit.message, 'Merge branch') && !contains(github.event.head_commit.message, '(#'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: >-
            ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Bump version and push tag（合并 PR / Actions 手动发版）
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
        env:
          BUMP: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bump || 'patch' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "${BUMP}" --no-git-tag-version
          VERSION="v$(node -p "require('./package.json').version")"
          if git rev-parse "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag ${VERSION} 已存在；请改 bump 档位、删远端 tag，或先合并会抬版本的变更"
            exit 1
          fi
          git add package.json package-lock.json
          git commit -m "chore(release): ${VERSION}"
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git push origin "HEAD:${{ github.event.pull_request.base.ref }}"
          else
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          git push origin "${VERSION}"

      - name: Resolve release tag
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA_FULL: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "pull_request" ]; then
            T="v$(node -p "require('./package.json').version")"
          elif [[ "$REF" == refs/tags/* ]]; then
            T="${REF#refs/tags/}"
          else
            PKG_VER=$(node -p "require('./package.json').version")
            SHORT=$(echo "$SHA_FULL" | cut -c1-7)
            T="v${PKG_VER}-dev.${RUN_NUMBER}-${SHORT}"
          fi
          echo "tag=${T}" >> "$GITHUB_OUTPUT"

      - name: Resolve HEAD SHA
        id: gitmeta
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          CONSOLE_VERSION: ${{ steps.ver.outputs.tag }}
          GIT_COMMIT: ${{ steps.gitmeta.outputs.sha }}
        run: |
          export BUILD_TIME="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          npm run build:ci

      - name: Sync console-version.json to release tag
        env:
          CONSOLE_VERSION: ${{ steps.ver.outputs.tag }}
          GIT_COMMIT: ${{ steps.gitmeta.outputs.sha }}
        run: |
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          export CONSOLE_VERSION GIT_COMMIT BUILD_TIME
          node ./scripts/write-console-version.mjs

      - name: Pack dist.zip
        run: |
          cd dist
          zip -r ../dist.zip .

      - name: Generate changelog
        id: changelog
        run: |
          set -euo pipefail
          if git describe --tags --abbrev=0 HEAD~1 >/dev/null 2>&1; then
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1)
            CURR_TAG="${{ steps.ver.outputs.tag }}"
            {
              echo "changelog<<EOF"
              echo "### 🚀 新功能"
              FEAT=$(git log --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" "$PREV_TAG..HEAD" --grep="^feat" 2>/dev/null || true)
              [ -n "$FEAT" ] && echo "$FEAT" || echo "* 无"
              echo ""
              echo "### 🐛 错误修复"
              FIX=$(git log --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" "$PREV_TAG..HEAD" --grep="^fix" 2>/dev/null || true)
              [ -n "$FIX" ] && echo "$FIX" || echo "* 无"
              echo ""
              echo "### ♻️ 重构"
              REFACTOR=$(git log --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" "$PREV_TAG..HEAD" --grep="^refactor" 2>/dev/null || true)
              [ -n "$REFACTOR" ] && echo "$REFACTOR" || echo "* 无"
              echo ""
              echo "### 🔨 其他更改"
              OTHER=$(git log --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" "$PREV_TAG..HEAD" --invert-grep --grep="^feat\|^fix\|^refactor" 2>/dev/null || true)
              [ -n "$OTHER" ] && echo "$OTHER" || echo "* 无"
              echo ""
              echo "**完整变更**: [\`$PREV_TAG...$CURR_TAG\`](https://github.com/${{ github.repository }}/compare/$PREV_TAG...$CURR_TAG)"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "changelog=🎉 **首次发布**" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Release ${{ steps.ver.outputs.tag }}
          prerelease: >-
            ${{
              (github.event_name == 'workflow_dispatch' && github.event.inputs.prerelease) ||
              (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/'))
            }}
          files: dist.zip
          body: |
            ## 更新内容

            ${{ steps.changelog.outputs.changelog }}

            ${{ github.event_name == 'pull_request' && '> **类型**：合并到 `main` / `master` 的 PR 触发的正式发版（默认 `patch` 递增 + 语义化 `v*` tag）。' || '' }}
            ${{ github.event_name == 'workflow_dispatch' && '> **类型**：Actions 手动发版。' || '' }}
            ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && '> **类型**：直推分支触发的测试发版（`v*`-`dev.*`，预发布）。' || '' }}
            ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-dev.') && '> **类型**：推送语义化 tag 触发的发版。' || '' }}
