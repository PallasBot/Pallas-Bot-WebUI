name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Checkout Bot openspec
        uses: actions/checkout@v4
        with:
          repository: PallasBot/Pallas-Bot
          ref: dev-v2
          path: Pallas-Bot
          sparse-checkout: |
            openspec
          sparse-checkout-cone-mode: true

      - name: Check generated OpenAPI types drift
        run: npm run check:console-openapi-types

      - name: Type check and build
        run: npm run build:ci
